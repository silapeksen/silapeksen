<svg xmlns="http://www.w3.org/2000/svg" width="900" height="870" viewBox="0 0 900 870">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="1" stop-color="#11173a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf2ff"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf2ff"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf2ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7cf2ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7cf2ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .orb { animation: drift 9s ease-in-out infinite alternate; }
    .orb2 { animation: drift 12s ease-in-out infinite alternate-reverse; }
    @keyframes drift {
      from { transform: translate(-40px, -20px); }
      to   { transform: translate(40px, 25px); }
    }
    .ring { transform-origin: 450px 130px; animation: spin 20s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .scan { animation: sweep 5s ease-in-out infinite; }
    @keyframes sweep {
      0%   { transform: translateY(-120px); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(170px); opacity: 0; }
    }
    .letter { opacity: 0; animation: rise 0.7s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade { opacity: 0; animation: fade 0.9s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .card { opacity: 0; animation: up 0.8s cubic-bezier(.2,.8,.2,1) forwards; }
    .c1 { animation-delay: 0.9s; }
    .c2 { animation-delay: 1.15s; }
    .c3 { animation-delay: 1.4s; }
    @keyframes up {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .frame { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { stroke-opacity: 0.35; }
      50%      { stroke-opacity: 0.9; }
    }
    .chip { opacity: 0; animation: fade 0.6s ease forwards; }
    .dot { animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0.2; } }
    .cursor { animation: cur 1s steps(1) infinite; }
    @keyframes cur { 50% { opacity: 0; } }
  </style>

  <rect width="900" height="870" rx="18" fill="url(#bg)"/>
  <circle class="orb" cx="150" cy="110" r="120" fill="#3b82f6" opacity="0.18" filter="url(#glow)"/>
  <circle class="orb2" cx="760" cy="260" r="140" fill="#ec4899" opacity="0.14" filter="url(#glow)"/>
  <circle class="ring" cx="450" cy="130" r="210" fill="none" stroke="#7cf2ff" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 14"/>

  <g class="scan">
    <rect x="0" y="126" width="900" height="3" fill="url(#scan)"/>
  </g>

  <!-- Başlık -->
  <text x="450" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="url(#name)" filter="url(#glow)">
    <tspan class="letter" style="animation-delay:0.2s">S</tspan><tspan class="letter" style="animation-delay:0.3s">ı</tspan><tspan class="letter" style="animation-delay:0.4s">l</tspan><tspan class="letter" style="animation-delay:0.5s">a</tspan><tspan class="letter" style="animation-delay:0.6s"> </tspan><tspan class="letter" style="animation-delay:0.7s">P</tspan><tspan class="letter" style="animation-delay:0.8s">e</tspan><tspan class="letter" style="animation-delay:0.9s">k</tspan><tspan class="letter" style="animation-delay:1.0s">ş</tspan><tspan class="letter" style="animation-delay:1.1s">e</tspan><tspan class="letter" style="animation-delay:1.2s">n</tspan>
  </text>
  <text class="fade" style="animation-delay:1.4s" x="450" y="186" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#c7d2fe">
    Veri analizi <tspan fill="#7cf2ff">·</tspan> Makine öğrenmesi <tspan fill="#7cf2ff">·</tspan> Istanbul
  </text>
  <text class="fade" style="animation-delay:1.7s" x="450" y="222" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#64748b">
    &gt; hoş geldin<tspan class="cursor">_</tspan>
  </text>

  <!-- Hakkımda -->
  <text class="fade" style="animation-delay:2s" x="54" y="320" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#7cf2ff">01 · Hakkımda</text>
  <text class="fade" style="animation-delay:2.15s" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e2e8f0">
    <tspan x="54" y="352">Bilgisayar Mühendisliği üçüncü sınıf öğrencisiyim.</tspan>
    <tspan x="54" y="378">Ham veriyi konuşturuyorum, cevap verene kadar ısrar ediyorum.</tspan>
    <tspan x="54" y="404">Overfitting yapmıyorum, sadece çok ezberliyorum.</tspan>
  </text>

  <!-- Projeler -->
  <text class="fade" style="animation-delay:2.4s" x="54" y="446" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#a78bfa">02 · Projeler</text>

  <g class="card c1">
    <rect x="30" y="462" width="260" height="165" rx="16" fill="url(#card)" stroke="url(#edge)" class="frame" stroke-width="1.5"/>
    <text x="54" y="498" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#7cf2ff">01</text>
    <text x="54" y="530" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Market Data Platform</text>
    <text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c7d2fe">
      <tspan x="54" y="556">Hisse, döviz ve kripto verisi için</tspan>
      <tspan x="54" y="573">uçtan uca veri hattı</tspan>
    </text>
    <rect x="54" y="589" width="130" height="24" rx="12" fill="#7cf2ff" fill-opacity="0.15" stroke="#7cf2ff" stroke-opacity="0.6"/>
    <circle class="dot" cx="70" cy="601" r="4" fill="#7cf2ff"/>
    <text x="82" y="605" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#7cf2ff">Devam ediyor</text>
  </g>

  <g class="card c2">
    <rect x="320" y="462" width="260" height="165" rx="16" fill="url(#card)" stroke="url(#edge)" class="frame" stroke-width="1.5"/>
    <text x="344" y="498" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#a78bfa">02</text>
    <text x="344" y="530" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Duygu Analizi</text>
    <text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c7d2fe">
      <tspan x="344" y="556">TF-IDF ve Logistic Regression ile</tspan>
      <tspan x="344" y="573">metin duygu sınıflandırma</tspan>
    </text>
    <rect x="344" y="589" width="110" height="24" rx="12" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.6"/>
    <circle cx="360" cy="601" r="4" fill="#34d399"/>
    <text x="372" y="605" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#34d399">Tamamlandı</text>
  </g>

  <g class="card c3">
    <rect x="610" y="462" width="260" height="165" rx="16" fill="url(#card)" stroke="url(#edge)" class="frame" stroke-width="1.5"/>
    <text x="634" y="498" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#ff7ad9">03</text>
    <text x="634" y="530" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Öğrenci Performansı</text>
    <text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c7d2fe">
      <tspan x="634" y="556">Haftalık çalışma süresi ile</tspan>
      <tspan x="634" y="573">GPA ilişkisinin incelenmesi</tspan>
    </text>
    <rect x="634" y="589" width="110" height="24" rx="12" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.6"/>
    <circle cx="650" cy="601" r="4" fill="#34d399"/>
    <text x="662" y="605" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#34d399">Tamamlandı</text>
  </g>

  <!-- Teknolojiler -->
  <text class="fade" style="animation-delay:2.6s" x="54" y="660" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#ff7ad9">03 · Stack</text>
  <g class="chip" style="animation-delay:2.8s">
    <rect x="53" y="672" width="90" height="34" rx="17" fill="#3776AB" fill-opacity="0.35" stroke="#3776AB"/>
    <text x="98" y="694" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#ffffff">Python</text>
  </g>
  <g class="chip" style="animation-delay:2.85s">
    <rect x="155" y="672" width="90" height="34" rx="17" fill="#150458" fill-opacity="0.6" stroke="#8b7bff"/>
    <text x="200" y="694" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#ffffff">pandas</text>
  </g>
  <g class="chip" style="animation-delay:2.9s">
    <rect x="257" y="672" width="130" height="34" rx="17" fill="#F7931E" fill-opacity="0.3" stroke="#F7931E"/>
    <text x="322" y="694" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#ffffff">scikit-learn</text>
  </g>
  <g class="chip" style="animation-delay:2.95s">
    <rect x="399" y="672" width="70" height="34" rx="17" fill="#ED8B00" fill-opacity="0.3" stroke="#ED8B00"/>
    <text x="434" y="694" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#ffffff">Java</text>
  </g>
  <g class="chip" style="animation-delay:3s">
    <rect x="481" y="672" width="80" height="34" rx="17" fill="#4479A1" fill-opacity="0.35" stroke="#4479A1"/>
    <text x="521" y="694" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#ffffff">MySQL</text>
  </g>
  <g class="chip" style="animation-delay:3.05s">
    <rect x="573" y="672" width="90" height="34" rx="17" fill="#2496ED" fill-opacity="0.3" stroke="#2496ED"/>
    <text x="618" y="694" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#ffffff">Docker</text>
  </g>
  <g class="chip" style="animation-delay:3.1s">
    <rect x="675" y="672" width="100" height="34" rx="17" fill="#017CEE" fill-opacity="0.3" stroke="#017CEE"/>
    <text x="725" y="694" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#ffffff">Airflow</text>
  </g>
  <g class="chip" style="animation-delay:3.15s">
    <rect x="787" y="672" width="60" height="34" rx="17" fill="#F05032" fill-opacity="0.3" stroke="#F05032"/>
    <text x="817" y="694" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#ffffff">Git</text>
  </g>

  <!-- İletişim -->
  <text class="fade" style="animation-delay:3.3s" x="54" y="748" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#7cf2ff">04 · İletişim</text>
  <text class="fade" style="animation-delay:3.45s" x="54" y="778" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#e2e8f0">slpkn503@gmail.com   <tspan fill="#7cf2ff">·</tspan>   linkedin.com/in/sila-peksen</text>

  <!-- Alt bilgi -->
  <text class="fade" style="animation-delay:3.6s" x="450" y="836" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#64748b">
    Bu sayfayı okuduğunuz için teşekkürler. Kodum hâlâ çalışıyor, nedenini de bilmiyorum.
  </text>
</svg>

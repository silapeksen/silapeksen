<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="1" stop-color="#11173a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf2ff"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf2ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7cf2ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7cf2ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .orb { animation: drift 9s ease-in-out infinite alternate; }
    .orb2 { animation: drift 12s ease-in-out infinite alternate-reverse; }
    @keyframes drift {
      from { transform: translate(-40px, -20px); }
      to   { transform: translate(40px, 25px); }
    }
    .ring { transform-origin: 450px 140px; animation: spin 14s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .scan { animation: sweep 4.5s ease-in-out infinite; }
    @keyframes sweep {
      0%   { transform: translateY(-140px); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(160px); opacity: 0; }
    }
    .letter { opacity: 0; animation: rise 0.7s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .tag { opacity: 0; animation: fade 1s ease 1.8s forwards; }
    @keyframes fade { to { opacity: 1; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="900" height="280" rx="18" fill="url(#bg)"/>
  <circle class="orb" cx="170" cy="70" r="110" fill="#3b82f6" opacity="0.18" filter="url(#glow)"/>
  <circle class="orb2" cx="740" cy="210" r="130" fill="#ec4899" opacity="0.16" filter="url(#glow)"/>

  <circle class="ring" cx="450" cy="140" r="200" fill="none" stroke="#7cf2ff" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 14"/>

  <g class="scan">
    <rect x="0" y="136" width="900" height="3" fill="url(#scan)"/>
  </g>

  <text x="450" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#name)" filter="url(#glow)">
    <tspan class="letter" style="animation-delay:0.2s">S</tspan><tspan class="letter" style="animation-delay:0.3s">ı</tspan><tspan class="letter" style="animation-delay:0.4s">l</tspan><tspan class="letter" style="animation-delay:0.5s">a</tspan><tspan class="letter" style="animation-delay:0.6s"> </tspan><tspan class="letter" style="animation-delay:0.7s">P</tspan><tspan class="letter" style="animation-delay:0.8s">e</tspan><tspan class="letter" style="animation-delay:0.9s">k</tspan><tspan class="letter" style="animation-delay:1.0s">ş</tspan><tspan class="letter" style="animation-delay:1.1s">e</tspan><tspan class="letter" style="animation-delay:1.2s">n</tspan>
  </text>

  <text class="tag" x="450" y="205" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#c7d2fe">
    Veri analizi <tspan fill="#7cf2ff">·</tspan> Makine öğrenmesi <tspan fill="#7cf2ff">·</tspan> Istanbul
  </text>
  <text class="tag" x="450" y="235" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#64748b">
    &gt; hoş geldin<tspan class="cursor">_</tspan>
  </text>
</svg>
